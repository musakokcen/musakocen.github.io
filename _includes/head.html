<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    /* migrate values stored by the old light/dark toggle */
    if (saved === 'dark' || saved === 'light') {
      saved = saved === 'dark' ? 'ink' : '';
      localStorage.setItem('theme', saved);
    }
    if (saved === null) {
      saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : '';
    }
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if site.umami.website_id and jekyll.environment == "production" %}
<!-- Umami: cookieless analytics, no consent banner needed -->
<script defer src="{{ site.umami.script_url }}" data-website-id="{{ site.umami.website_id }}" data-do-not-track="true"></script>
{% endif %}
